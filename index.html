<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мурко і Архів часу</title>
<style>
@font-face{font-family:Nunito;font-weight:600;src:url(assets/fonts/nunito-cyrillic-600-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Nunito;font-weight:600;src:url(assets/fonts/nunito-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF,U+2212}
@font-face{font-family:Nunito;font-weight:800;src:url(assets/fonts/nunito-cyrillic-800-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Nunito;font-weight:800;src:url(assets/fonts/nunito-latin-800-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF,U+2212}
@font-face{font-family:Comfortaa;font-weight:700;src:url(assets/fonts/comfortaa-cyrillic-700-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Comfortaa;font-weight:700;src:url(assets/fonts/comfortaa-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF,U+2212}

:root{
  --ink:#3b2412; --paper:#fff8ea; --paper2:#f6e8c8; --brass:#b8862f; --brass-d:#7a5320;
  --teal:#4fe3d6; --teal-d:#138a86; --ok:#2f9e44; --bad:#d9480f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#120c08;overflow:hidden}
body{font-family:Nunito,"Trebuchet MS",sans-serif;font-weight:600;color:var(--ink);-webkit-user-select:none;user-select:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}

#stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;background:#000}
.bg{position:absolute;inset:0;background-size:100% 100%;opacity:0;transition:opacity .9s ease}
.bg.on{opacity:1}

/* ---------- actors ---------- */
#actors{position:absolute;inset:0;pointer-events:none}
.actor{position:absolute;transform:translate(-50%,-100%);transition:left 1.4s cubic-bezier(.45,.05,.3,1),opacity .6s ease;pointer-events:none}
.actor img{display:block;height:100%;filter:drop-shadow(0 14px 10px rgba(0,0,0,.28))}
.actor.hidden{opacity:0}
.actor.flip img{transform:scaleX(-1)}
.actor.talk img{animation:talk .55s ease}
.actor.flip.talk img{animation:talkf .55s ease}
@keyframes talk{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
@keyframes talkf{0%,100%{transform:scaleX(-1) translateY(0)}40%{transform:scaleX(-1) translateY(-14px)}}
.actor.roll img{animation:roll .35s ease-in-out infinite}
@keyframes roll{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.actor.float img{animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.actor.clickable{pointer-events:auto;cursor:pointer}
.actor.glow img{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 6px rgba(255,214,102,.6)) drop-shadow(0 0 2px #fff)}50%{filter:drop-shadow(0 0 26px rgba(255,214,102,1)) drop-shadow(0 0 8px #fff)}}
.actor.holo img{filter:drop-shadow(0 0 18px rgba(79,227,214,.9)) brightness(1.1);animation:flicker 2.4s steps(1) infinite}
@keyframes flicker{0%{opacity:.9}7%{opacity:.35}9%{opacity:.85}38%{opacity:.6}40%{opacity:.95}71%{opacity:.4}73%{opacity:.9}100%{opacity:.9}}

/* ---------- glitch on backgrounds ---------- */
.glitch{position:absolute;background-size:1920px 1080px;pointer-events:none;mix-blend-mode:normal;animation:glitch 3.2s steps(1) infinite}
.glitch.strong{animation-duration:1.3s}
@keyframes glitch{
  0%,62%,100%{transform:none;filter:none;opacity:0}
  63%{transform:translateX(-16px);filter:hue-rotate(80deg) saturate(2);opacity:1;clip-path:inset(10% 0 62% 0)}
  65%{transform:translateX(22px);filter:hue-rotate(-60deg) brightness(1.4);opacity:1;clip-path:inset(48% 0 30% 0)}
  67%{transform:translateX(-8px);opacity:1;clip-path:inset(72% 0 6% 0)}
  69%{opacity:0}
  84%{transform:translateX(12px);filter:hue-rotate(140deg) brightness(1.5);opacity:1;clip-path:inset(28% 0 50% 0)}
  86%{opacity:0}
}
.scan{position:absolute;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(79,227,214,.10) 0 2px,transparent 2px 6px);mix-blend-mode:screen;animation:scan 3.2s steps(1) infinite}
@keyframes scan{0%,60%,100%{opacity:0}62%,70%{opacity:1}84%,87%{opacity:.8}}

/* ---------- HUD ---------- */
#hud{position:absolute;left:28px;top:24px;display:flex;align-items:center;gap:14px;padding:10px 22px 10px 18px;border-radius:40px;background:rgba(255,248,234,.88);border:3px solid var(--brass);box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;transition:opacity .6s}
#hud.on{opacity:1}
#hud b{font-family:Comfortaa;font-weight:700;font-size:26px;margin-right:6px}
#hud .slot{width:46px;height:62px;border-radius:12px;display:grid;place-items:center;background:rgba(122,83,32,.12)}
#hud .slot img{height:58px;filter:grayscale(1) brightness(.9);opacity:.28;transition:all .8s}
#hud .slot.have img{filter:none;opacity:1}

#tools{position:absolute;right:24px;top:22px;display:flex;gap:12px;z-index:70}
#tools button{width:64px;height:64px;border-radius:50%;background:rgba(255,248,234,.85);border:3px solid var(--brass);font-size:30px;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.25)}
#tools button:hover{background:#fff}
#tools #btnMusic{font-size:34px;font-weight:800}
#tools #btnMusic.off{opacity:.45;text-decoration:line-through}
#menu{position:absolute;right:24px;top:100px;z-index:70;background:var(--paper);border:4px solid var(--brass);border-radius:24px;padding:18px;display:none;min-width:420px;max-height:900px;overflow:auto;box-shadow:0 12px 30px rgba(0,0,0,.4)}
#menu.on{display:block}
#menu h3{font-family:Comfortaa;font-size:26px;margin:0 0 10px 6px}
#menu button{display:block;width:100%;text-align:left;font-size:26px;padding:7px 16px;border-radius:14px}
#menu button:hover{background:var(--paper2)}
#menu small{display:block;font-size:20px;opacity:.7;margin:12px 6px 0}

/* ---------- dialogue ---------- */
#dialog{position:absolute;left:50%;bottom:22px;width:1560px;transform:translateX(-50%) translateY(30px);min-height:176px;padding:30px 230px 28px 48px;background:var(--paper);border:5px solid var(--brass-d);border-radius:30px;box-shadow:0 14px 34px rgba(0,0,0,.35),inset 0 0 0 4px #f1dfb5;opacity:0;transition:opacity .35s,transform .35s;z-index:20}
#dialog:not(.on){pointer-events:none}
#dialog.on{opacity:1;transform:translateX(-50%) translateY(0)}
#name{position:absolute;left:40px;top:-30px;padding:6px 26px 8px;border-radius:18px;font-family:Comfortaa;font-weight:700;font-size:30px;color:#fff;background:var(--brass-d);box-shadow:0 4px 10px rgba(0,0,0,.25)}
#name:empty{display:none}
#text{font-size:37px;line-height:1.38}
#text i{font-style:normal;color:var(--teal-d)}
#next{position:absolute;right:30px;bottom:26px;padding:16px 30px;border-radius:22px;background:linear-gradient(#ffd66b,#f0a531);border:3px solid var(--brass-d);font-weight:800;font-size:32px;box-shadow:0 5px 0 var(--brass-d);transition:transform .1s}
#next:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brass-d)}
#next.wait{animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
#next[hidden]{display:none}
#choices{display:flex;gap:22px;margin-top:20px;flex-wrap:wrap}
#choices:empty{display:none}
.ch{min-width:180px;padding:14px 30px;border-radius:22px;font-size:36px;font-weight:800;background:#fff;border:4px solid var(--brass);box-shadow:0 5px 0 var(--brass-d);transition:transform .1s,background .2s}
.ch:hover{background:#fff4d6}
.ch.right{background:#c7f0cf;border-color:var(--ok);box-shadow:0 5px 0 #1f6b2e}
.ch.wrong{background:#ffd8c7;border-color:var(--bad);box-shadow:0 5px 0 #8f2f09;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.bigbtn{position:absolute;left:50%;transform:translateX(-50%);padding:26px 64px;border-radius:40px;font-family:Comfortaa;font-weight:700;font-size:52px;color:var(--ink);background:linear-gradient(#ffe08a,#f0a531);border:5px solid var(--brass-d);box-shadow:0 8px 0 var(--brass-d),0 0 40px rgba(255,214,102,.7);animation:pulse 1.6s ease-in-out infinite;z-index:30}
@keyframes pulse{0%,100%{box-shadow:0 8px 0 var(--brass-d),0 0 20px rgba(255,214,102,.5)}50%{box-shadow:0 8px 0 var(--brass-d),0 0 60px rgba(255,214,102,1)}}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;z-index:15;display:none}
.overlay.on{display:block}
.dim{position:absolute;inset:0;background:rgba(20,12,6,.72);animation:fadein .5s}
@keyframes fadein{from{opacity:0}}

/* watch puzzle */
#watchBox .watchImg{position:absolute;left:150px;top:130px;height:560px;filter:drop-shadow(0 20px 30px rgba(0,0,0,.5));animation:zoomin .7s cubic-bezier(.2,1.3,.4,1)}
@keyframes zoomin{from{transform:scale(.3);opacity:0}}
.note{position:absolute;left:310px;top:640px;padding:20px 40px 24px;background:#fbf0d2;border:2px solid #c9a86a;border-radius:6px;transform:rotate(-6deg);font-family:Comfortaa;font-weight:700;font-size:64px;letter-spacing:4px;box-shadow:0 10px 20px rgba(0,0,0,.4);animation:zoomin .7s .3s backwards}
.note:before{content:"";position:absolute;left:50%;top:-14px;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a7a,#b5281a)}
#clock{position:absolute;left:1080px;top:50px;width:640px;height:640px;touch-action:none;animation:zoomin .7s .15s backwards}
#clock .hand{cursor:grab}
#clock.dragging .hand{cursor:grabbing}
#checkClock{top:712px;left:1400px;animation:none;font-size:44px;padding:18px 54px}

/* portal */
#portal{position:absolute;inset:0;z-index:40;pointer-events:none;display:none}
#portal.on{display:block}
#portal .swirl{position:absolute;left:50%;top:50%;width:2600px;height:2600px;margin:-1300px 0 0 -1300px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,214,102,.95) 0 9deg,rgba(79,227,214,.85) 14deg,rgba(255,255,255,.9) 20deg,rgba(255,170,60,.0) 30deg),radial-gradient(circle,#fff 0 4%,rgba(255,214,102,.9) 14%,rgba(18,12,8,.0) 60%);
  -webkit-mask:radial-gradient(circle,transparent 0 3%,#000 12%,#000 60%,transparent 72%);mask:radial-gradient(circle,transparent 0 3%,#000 12%,#000 60%,transparent 72%);
  filter:blur(3px);transform:scale(0) rotate(0);animation:swirl 2.6s cubic-bezier(.5,0,.6,1) forwards}
#portal .swirl.b{animation-name:swirl2;opacity:.7}
@keyframes swirl{to{transform:scale(1.2) rotate(1080deg)}}
@keyframes swirl2{to{transform:scale(1) rotate(-900deg)}}
#portal .flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flash 3.4s ease forwards}
@keyframes flash{0%,62%{opacity:0}80%{opacity:1}100%{opacity:1}}
#fade{position:absolute;inset:0;z-index:45;pointer-events:none;background:#fff;opacity:0;transition:opacity .9s ease}
#fade.black{background:#120c08}
#fade.on{opacity:1}

/* time map */
#mapBox .holo{position:absolute;left:150px;top:118px;width:1620px;height:590px;border-radius:36px;
  background:linear-gradient(180deg,rgba(14,60,66,.93),rgba(8,36,44,.95));border:3px solid rgba(79,227,214,.9);
  box-shadow:0 0 40px rgba(79,227,214,.6),inset 0 0 60px rgba(79,227,214,.18);color:#e9fffb;overflow:hidden;
  transform-origin:960px 470px;animation:holo .9s cubic-bezier(.2,1.2,.4,1)}
@keyframes holo{from{transform:translate(0,180px) scale(.28,.3);opacity:0}}
#mapBox .holo:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(79,227,214,.07) 0 2px,transparent 2px 5px);pointer-events:none}
#mapBox h2{font-family:Comfortaa;font-weight:700;font-size:46px;text-align:center;margin-top:30px;letter-spacing:2px;color:#bff8f1;text-shadow:0 0 14px rgba(79,227,214,.8)}
.tl{position:absolute;left:110px;right:110px;top:300px;height:8px;border-radius:4px;background:linear-gradient(90deg,rgba(79,227,214,.35),rgba(79,227,214,.9))}
.tl:after{content:"";position:absolute;right:-26px;top:-13px;border:17px solid transparent;border-left:26px solid rgba(79,227,214,.95)}
.era-node{position:absolute;top:304px;width:300px;margin-left:-150px;text-align:center}
.era-node .dot{position:absolute;left:50%;top:-50px;width:100px;height:100px;margin-left:-50px;border-radius:50%;background:rgba(8,36,44,.95);border:4px solid rgba(79,227,214,.55);display:grid;place-items:center}
.era-node .dot img{height:76px;filter:grayscale(1) brightness(1.4);opacity:.35}
.era-node .nm{position:absolute;left:0;right:0;bottom:66px;font-size:30px;line-height:1.15;color:#bff8f1;font-weight:800}
.era-node .cent{position:absolute;left:0;right:0;top:66px;font-family:Comfortaa;font-weight:700;font-size:40px;color:#fff}
.era-node .cent small{display:block;font-family:Nunito;font-weight:600;font-size:24px;opacity:.75;margin-top:4px}
.era-node.next .dot{border-color:#ffd66b;box-shadow:0 0 0 0 rgba(255,214,102,.9);animation:ring 1.4s infinite;cursor:pointer}
.era-node.next .dot img{filter:none;opacity:1}
.era-node.next{cursor:pointer}
.era-node.done .dot img{filter:none;opacity:1}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,214,102,.9)}100%{box-shadow:0 0 0 34px rgba(255,214,102,0)}}
.era-node .here{position:absolute;left:50%;top:172px;transform:translateX(-50%);white-space:nowrap;font-size:24px;font-weight:800;color:#120c08;background:#ffd66b;padding:4px 14px;border-radius:12px}
.ad{position:absolute;top:252px;width:4px;height:196px;background:repeating-linear-gradient(180deg,#ffd66b 0 8px,transparent 8px 14px)}
.ad span{position:absolute;top:204px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:22px;color:#ffd66b;font-weight:800}

/* sockets highlight */
.sock{position:absolute;width:64px;height:48px;margin:-24px 0 0 -32px;border-radius:50%;box-shadow:0 0 0 4px rgba(255,214,102,.95),0 0 26px 6px rgba(255,214,102,.85);opacity:0;pointer-events:none}
.sock.on{animation:sock 1.2s ease-in-out 3}
@keyframes sock{50%{opacity:1}}


/* ---------- task panels ---------- */
.panel{position:absolute;left:50%;top:56px;width:1400px;height:770px;margin-left:-700px;background:linear-gradient(#fbf1d4,#efdcae);border:5px solid #9b7337;border-radius:28px;box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 0 0 4px #f8e9c4;animation:zoomin .6s cubic-bezier(.2,1.2,.4,1)}
.panel h2{font-family:Comfortaa;font-weight:700;font-size:44px;text-align:center;margin-top:26px;padding:0 290px;line-height:1.15}
.panel .tag{position:absolute;top:28px;left:34px;font-size:24px;font-weight:800;color:#fff;background:#8a6224;padding:5px 16px;border-radius:14px}
.panel .tag.bonus{background:#7b4fa8}
.panel svg.lines{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.card{position:absolute;width:250px;height:112px;border-radius:22px;background:#fffaf0;border:4px solid #b58a46;font-family:Comfortaa;font-weight:700;font-size:62px;display:grid;place-items:center;box-shadow:0 6px 0 #8a6224;cursor:pointer;transition:background .2s,border-color .2s}
.card.roman{background:linear-gradient(#efe3c6,#dccaa0);letter-spacing:4px}
.card:hover{background:#fff4d6}
.card.sel{border-color:#f0a531;box-shadow:0 0 0 7px rgba(240,165,49,.55),0 6px 0 #8a6224}
.card.right{background:#c7f0cf;border-color:var(--ok);box-shadow:0 6px 0 #1f6b2e;cursor:default}
.card.wrong{background:#ffd8c7;border-color:var(--bad);animation:shake .4s}
.rule{position:absolute;left:0;right:0;text-align:center;font-size:30px}
.rule b{color:#8a3c12}
.ctile{position:absolute;width:112px;height:124px;border-radius:18px;display:grid;place-items:center;font-family:Comfortaa;font-weight:700;font-size:70px;background:linear-gradient(#efe3c6,#dccaa0);border:4px solid #9b7337;box-shadow:0 5px 0 #7a5320}
.cslot{position:absolute;width:112px;height:124px;border-radius:18px;display:grid;place-items:center;font-family:Comfortaa;font-weight:700;font-size:70px;background:#fffaf0;border:4px dashed #b58a46}
.cslot.act{border-style:solid;border-color:#f0a531;box-shadow:0 0 0 7px rgba(240,165,49,.5)}
.cslot.ok{background:#c7f0cf;border:4px solid var(--ok)}
.cslot.bad{background:#ffd8c7;border:4px solid var(--bad);animation:shake .4s}
.carrow{position:absolute;font-size:44px;color:#8a3c12;font-weight:800}
.kb{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:8px}
.key{width:68px;height:78px;border-radius:14px;background:#fff;border:3px solid #b58a46;box-shadow:0 4px 0 #8a6224;font-family:Comfortaa;font-weight:700;font-size:38px}
.key:hover{background:#fff4d6}
.key.hint{background:#ffe08a;border-color:#f0a531;animation:pulse 1s infinite}
.choiceRow{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:40px}
.choiceRow .ch{font-size:36px}
svg.sticks .st{cursor:pointer}
svg.sticks .st:hover .wood{stroke:#ffd77a}
svg.sticks .ghostS{cursor:pointer}
svg.sticks .ghostS line{stroke:#f0a531;stroke-width:14;stroke-dasharray:14 12;opacity:.85}
svg.sticks .ghostS:hover line{opacity:1;stroke:#e8590c}
.hand{position:absolute;right:40px;top:120px;width:200px;text-align:center;font-size:24px;font-weight:800;cursor:pointer}

/* ---------- reward ---------- */
#reward{position:absolute;inset:0;z-index:16;pointer-events:none}
#reward .rays{position:absolute;left:960px;top:400px;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;background:repeating-conic-gradient(rgba(255,230,140,.55) 0 10deg,rgba(255,230,140,0) 10deg 20deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 70%);mask:radial-gradient(circle,#000 20%,transparent 70%);animation:spin 12s linear infinite,fadein .8s}
@keyframes spin{to{transform:rotate(360deg)}}
#reward .coreBig{position:absolute;left:960px;top:400px;height:380px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 40px rgba(255,220,120,.9));animation:corein 1s cubic-bezier(.2,1.4,.4,1);transition:left 1.1s cubic-bezier(.6,0,.3,1),top 1.1s cubic-bezier(.6,0,.3,1),height 1.1s cubic-bezier(.6,0,.3,1),opacity .3s 1s}
@keyframes corein{from{transform:translate(-50%,-50%) scale(0) rotate(-30deg)}}
.frag{position:absolute;left:50%;top:110px;width:1100px;margin-left:-550px;padding:40px 56px 46px;background:linear-gradient(#fbf1d4,#efdcae);border:5px solid #9b7337;border-radius:26px;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:zoomin .6s cubic-bezier(.2,1.2,.4,1);z-index:16}
.frag .ft{display:inline-block;font-family:Comfortaa;font-weight:700;font-size:26px;color:#fff;background:#138a86;padding:6px 18px;border-radius:14px;margin-bottom:22px}
.frag p{font-size:40px;line-height:1.4}
.frag:before{content:"";position:absolute;inset:-5px;border-radius:26px;box-shadow:0 0 30px rgba(79,227,214,.6);pointer-events:none}
.coreInSock{position:absolute;height:100px;transform:translate(-50%,-82%);filter:drop-shadow(0 0 14px rgba(255,220,120,.9));pointer-events:none;animation:fadein 1s}

/* ---------- hologram of old Murko ---------- */
.ghost{position:absolute;right:120px;top:300px;height:380px;pointer-events:none;z-index:13;opacity:0}
.ghost img{height:100%}
.ghost.run{animation:ghost 2.2s steps(1) forwards}
@keyframes ghost{0%{opacity:0}8%{opacity:1}12%{opacity:.2}16%{opacity:1}55%{opacity:.85}58%{opacity:.1}62%{opacity:.9}88%{opacity:.6}92%{opacity:0}100%{opacity:0}}
.ghost.s1 img{filter:brightness(0) blur(14px);opacity:.4;transform:scale(.85);transform-origin:bottom center}
.ghost.s2 img{filter:brightness(0) blur(2px);opacity:.62}
.ghost.s3 img{filter:brightness(0) drop-shadow(0 0 2px #4fe3d6) drop-shadow(0 0 3px #4fe3d6) drop-shadow(0 0 14px rgba(79,227,214,.9));opacity:.8}
.ghost.s4 img{filter:saturate(.75) brightness(1.15) blur(1.5px) drop-shadow(0 0 16px rgba(79,227,214,.9));opacity:.5}
.ghost.s5 img{filter:brightness(1.1) drop-shadow(0 0 22px rgba(79,227,214,1));opacity:.85}


/* ---------- epoch 2 ---------- */

  if(SND.ctx){ if(SND.ctx.state === 'suspended') SND.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
  SND.ctx = new AC(); SND.master = SND.ctx.createGain(); SND.master.gain.value = 0.55;
  const comp = SND.ctx.createDynamicsCompressor(); SND.master.connect(comp); comp.connect(SND.ctx.destination);
}
function tone(f, t, dur, {type = 'sine', g = .3, a = .005, r = null, f2 = null} = {}){
  const c = SND.ctx, o = c.createOscillator(), v = c.createGain(), end = t + (r ?? dur);
  o.type = type; o.frequency.setValueAtTime(f, t); if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(g, t + a); v.gain.exponentialRampToValueAtTime(.0001, end);
  o.connect(v); v.connect(SND.master); o.start(t); o.stop(end + .05);
}
let NOISE = null;
function noise(t, dur, {g = .2, f = 1200, q = 1, type = 'bandpass', f2 = null, a = .01} = {}){
  const c = SND.ctx;
  if(!NOISE){ const len = c.sampleRate * 3; NOISE = c.createBuffer(1, len, c.sampleRate); const d = NOISE.getChannelData(0); for(let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; }
  const src = c.createBufferSource(), fl = c.createBiquadFilter(), v = c.createGain();
  src.buffer = NOISE; fl.type = type; fl.frequency.setValueAtTime(f, t); if(f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur); fl.Q.value = q;
  v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(g, t + a); v.gain.exponentialRampToValueAtTime(.0001, t + dur);
  src.connect(fl); fl.connect(v); v.connect(SND.master); src.start(t); src.stop(t + dur + .05);
}
function sfx(name){
  if(!SND.on) return; audioInit(); if(!SND.ctx || SND.ctx.state !== 'running' && SND.ctx.state !== 'suspended') return;
  const now = performance.now(); if(SND.last[name] && now - SND.last[name] < 90) return; SND.last[name] = now;
  const t = SND.ctx.currentTime + .01;
  try {
  switch(name){
    case 'click': tone(1400, t, .05, {type:'triangle', g:.07, r:.05}); break;
    case 'tick': tone(2600, t, .03, {type:'square', g:.03, r:.03}); break;
    case 'ok': tone(880, t, .18, {type:'triangle', g:.22}); tone(1318.5, t + .09, .35, {type:'triangle', g:.22}); tone(2637, t + .09, .3, {g:.05}); break;
    case 'bad': tone(220, t, .22, {g:.25, f2:150}); tone(233, t, .22, {type:'triangle', g:.08, f2:160}); break;
    case 'step': tone(660, t, .07, {type:'triangle', g:.1, r:.08}); break;
    case 'crash': noise(t, .35, {g:.35, f:300, q:.7, type:'lowpass'}); tone(110, t, .3, {g:.3, f2:55}); break;
    case 'win': [523.3, 659.3, 784, 1046.5].forEach((f, i) => tone(f, t + i * .09, .4, {type:'triangle', g:.18})); break;
    case 'core':
      [1046.5, 1318.5, 1568, 2093, 2637].forEach((f, i) => { tone(f, t + i * .07, .7, {g:.12}); tone(f * 1.005, t + i * .07, .7, {type:'triangle', g:.05}); });
      tone(130.8, t, 1.6, {g:.18, a:.2}); break;
    case 'slot': tone(196, t, .5, {type:'triangle', g:.22, f2:180}); tone(1568, t + .05, .6, {g:.08}); tone(2093, t + .12, .6, {g:.06}); break;
    case 'portal':
      noise(t, 2.8, {g:.28, f:200, f2:6000, q:1.5, a:.6});
      tone(110, t, 2.8, {type:'sawtooth', g:.05, f2:880, a:.5});
      [523.3, 784, 1046.5, 1568].forEach((f, i) => tone(f, t + 2 + i * .08, 1.2, {g:.1})); break;
    case 'glitch': for(let i = 0; i < 5; i++){ const tt = t + i * .06 + Math.random() * .03; noise(tt, .05, {g:.12, f:800 + Math.random() * 3000, q:4}); tone(60 + Math.random() * 400, tt, .04, {type:'square', g:.035}); } break;
    case 'ghost':
      noise(t, 2.2, {g:.07, f:2400, q:6, a:.4});
      for(let i = 0; i < 8; i++) tone(1760 + (i % 2) * 220, t + i * .22, .5, {g:.03, a:.08});
      tone(440, t, 2.2, {g:.05, a:.6, f2:466}); break;
    case 'whoosh': noise(t, .45, {g:.18, f:600, f2:3000, q:.8}); break;
    case 'appear': tone(784, t, .3, {g:.1}); tone(1175, t + .08, .4, {g:.08}); break;
    case 'fanfare':
      [[523.3, 0], [659.3, .14], [784, .28], [1046.5, .42], [784, .62], [1046.5, .76]].forEach(([f, d]) => { tone(f, t + d, .45, {type:'square', g:.05}); tone(f, t + d, .5, {type:'triangle', g:.14}); });
      [523.3, 659.3, 784, 1046.5].forEach(f => tone(f, t + 1, 1.6, {type:'triangle', g:.08, a:.05})); break;
  }
  } catch(e){}
}

function fadeAudio(a, to, ms, done){
  if(!a) return; clearInterval(a._fade); const from = a.volume, t0 = performance.now();
  a._fade = setInterval(() => { const k = Math.min(1, (performance.now() - t0) / ms); a.volume = Math.max(0, Math.min(1, from + (to - from) * k)); if(k >= 1){ clearInterval(a._fade); done && done(); } }, 40);

function clockSVG(){

  <defs>
    <radialGradient id="rim" cx="40%" cy="35%"><stop offset="0" stop-color="#ffe7a3"/><stop offset=".55" stop-color="#c9952f"/><stop offset="1" stop-color="#7a5320"/></radialGradient>

    <filter id="sh"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity=".35"/></filter>
  </defs>
  <circle r="306" fill="url(#rim)" stroke="#5a3a14" stroke-width="6"/>
  <circle r="262" fill="url(#face)" stroke="#8a6224" stroke-width="5"/>`;
  for(let i = 0; i < 60; i++){
    const a = i * 6 * Math.PI / 180, big = i % 5 === 0, r1 = big ? 222 : 236, r2 = 250;
    s += `<line x1="${(r1*Math.sin(a)).toFixed(1)}" y1="${(-r1*Math.cos(a)).toFixed(1)}" x2="${(r2*Math.sin(a)).toFixed(1)}" y2="${(-r2*Math.cos(a)).toFixed(1)}" stroke="#3b2412" stroke-width="${big?7:3}" stroke-linecap="round"/>`;
  }
  for(let n = 1; n <= 12; n++){
    const a = n * 30 * Math.PI / 180, r = 182;
    s += `<text x="${(r*Math.sin(a)).toFixed(1)}" y="${(-r*Math.cos(a)+19).toFixed(1)}" text-anchor="middle" font-family="Comfortaa" font-weight="700" font-size="56" fill="#3b2412">${n}</text>`;
  }
  s += `<g id="hHour" class="hand" filter="url(#sh)"><line y1="20" y2="-200" stroke="transparent" stroke-width="70"/><path d="M-13 22 L-9 -120 L0 -150 L9 -120 L13 22 Z" fill="#3b2412"/></g>
  <g id="hMin" class="hand" filter="url(#sh)"><line y1="30" y2="-260" stroke="transparent" stroke-width="60"/><path d="M-8 30 L-6 -200 L0 -232 L6 -200 L8 30 Z" fill="#7a2e12"/></g>
  <circle r="16" fill="#c9952f" stroke="#3b2412" stroke-width="4"/></svg>`;
  return s;
}

function makeClock(svg){
  const H = svg.querySelector('#hHour'), M = svg.querySelector('#hMin');
  const c = {T:0, locked:false};
  const draw = () => {
    const t = ((c.T % 720) + 720) % 720;
    H.setAttribute('transform', `rotate(${t / 2})`);
    M.setAttribute('transform', `rotate(${(t % 60) * 6})`);
  };
  const angle = e => {
    const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    const q = p.matrixTransform(svg.getScreenCTM().inverse());
    let a = Math.atan2(q.x, -q.y) * 180 / Math.PI; return (a + 360) % 360;
  };
  let drag = null;
  const down = which => e => { if(c.locked) return; e.preventDefault(); drag = which; svg.classList.add('dragging'); svg.setPointerCapture(e.pointerId); };
  H.addEventListener('pointerdown', down('h')); M.addEventListener('pointerdown', down('m'));
  svg.addEventListener('pointermove', e => {
    if(!drag) return;
    const a = angle(e), t = ((c.T % 720) + 720) % 720, h = Math.floor(t / 60), m = t % 60;
    if(drag === 'm'){
      const nm = Math.round(a / 6) % 60; let nh = h;
      if(m > 45 && nm < 15) nh = (h + 1) % 12; else if(m < 15 && nm > 45) nh = (h + 11) % 12;
      c.T = nh * 60 + nm;
    } else {
      const nh = Math.floor(a / 30) % 12; c.T = nh * 60 + m;
    }
    draw(); const mm = ((c.T % 60) + 60) % 60; if(mm !== c._lm){ c._lm = mm; sfx('tick'); }
  });
  const up = () => { drag = null; svg.classList.remove('dragging'); };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  c.lock = () => { c.locked = true; };
  c.spinBack = ms => cancellable(res => {
    const start = performance.now(), T0 = c.T;
    const step = now => {
      const k = Math.min(1, (now - start) / ms), e = k * k;
      c.T = T0 - e * 720 * 3; draw();
      if(k < 1) requestAnimationFrame(step); else res();
    };
    requestAnimationFrame(step);
  });
  draw(); return c;
}

/* ---- 1.1 римські числа ---- */
const ROMAN = [['IX', 9, 'I стоїть перед X — віднімаємо: 10 − 1.'], ['XIV', 14, 'X + IV: 10 + 4.'], ['XXVI', 26, 'X + X + V + I: 10 + 10 + 5 + 1.'], ['XL', 40, 'X стоїть перед L — віднімаємо: 50 − 10.']];
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
async function romanTask(){
  const p = panel('Математика', 'Римські числа на сувоях');
  p.insertAdjacentHTML('beforeend', '<svg class="lines"></svg><div class="rule" style="top:110px">Натисніть на римське число, а потім — на його значення.</div>');
  const svg = p.querySelector('svg.lines');
  const nums = shuffle(ROMAN.map(r => r[1]));
  const L = [], R = [];
  ROMAN.forEach((r, i) => { const c = document.createElement('div'); c.className = 'card roman'; c.textContent = r[0]; c.style.left = '300px'; c.style.top = (190 + i * 140) + 'px'; p.append(c); L.push(c); });
  nums.forEach((n, i) => { const c = document.createElement('div'); c.className = 'card'; c.textContent = n; c.style.left = '850px'; c.style.top = (190 + i * 140) + 'px'; c.dataset.v = n; p.append(c); R.push(c); });
  await say('hypatia', 'Розмиті римські числа треба з’єднати з їхніми значеннями. Пам’ятайте: <i>I = 1, V = 5, X = 10, L = 50</i>.', {noNext:true});
  await cancellable(res => {
    let sel = null, done = 0;
    L.forEach((c, i) => c.onclick = () => { if(c.classList.contains('right')) return; L.forEach(x => x.classList.remove('sel')); c.classList.add('sel'); sel = i; });
    R.forEach(c => c.onclick = () => {
      if(c.classList.contains('right')) return;
      if(sel === null){ textEl.innerHTML = 'Спочатку натисніть на <i>римське число</i> зліва.'; return; }
      const r = ROMAN[sel];
      if(+c.dataset.v === r[1]){
        L[sel].classList.remove('sel'); L[sel].classList.add('right'); c.classList.remove('wrong'); c.classList.add('right');
        const y1 = 190 + sel * 140 + 56, y2 = parseInt(c.style.top) + 56;
        svg.insertAdjacentHTML('beforeend', `<line x1="550" y1="${y1}" x2="850" y2="${y2}" stroke="#2f9e44" stroke-width="7" stroke-linecap="round"/>`);
        textEl.innerHTML = `Так! <i>${r[0]} = ${r[1]}</i>. ${r[2]}`;
        sel = null; done++;
        if(done === ROMAN.length) setTimeout(res, 1300);
      } else {
        c.classList.remove('wrong'); void c.offsetWidth; c.classList.add('wrong'); setTimeout(() => c.classList.remove('wrong'), 700);
        textEl.innerHTML = `Не ${c.dataset.v}… Підказка: ${r[2]}`;
      }
    });
  });
  closePanel();
}

const ABC = 'АБВГҐДЕЄЖЗИІЇЙКЛМНОПРСТУФХЦЧШЩЬЮЯ'.split('');
async function cipherTask(){
  const word = 'МУДРІСТЬ'.split('');
  const enc = word.map(ch => ABC[(ABC.indexOf(ch) + 1) % ABC.length]);
  const p = panel('Інформатика · кодування', 'Шифр Гіпатії');
  const W = 112, G = 22, total = word.length * W + (word.length - 1) * G, x0 = (1400 - total) / 2;
  let html = '<div class="rule" style="top:100px">Кожну літеру замінено <b>наступною</b> в абетці. Щоб розшифрувати — беремо <b>попередню</b>.</div>';
  enc.forEach((ch, i) => { html += `<div class="ctile" style="left:${x0 + i * (W + G)}px;top:165px">${ch}</div><div class="cslot" data-i="${i}" style="left:${x0 + i * (W + G)}px;top:345px"></div>`; });
  html += `<div class="carrow" style="left:${x0 - 92}px;top:290px">↓ крок<br>назад</div>`;
  html += '<div class="kb" style="top:520px"></div><div class="kb" style="top:612px"></div>';
  p.insertAdjacentHTML('beforeend', html);
  p.querySelector('.carrow').style.cssText += ';font-size:28px;line-height:1.1;text-align:center';
  const rows = p.querySelectorAll('.kb');
  ABC.forEach((ch, i) => { const k = document.createElement('button'); k.className = 'key'; k.textContent = ch; k.dataset.ch = ch; rows[i < 17 ? 0 : 1].append(k); });
  const slots = [...p.querySelectorAll('.cslot')];
  await say('hypatia', 'Я зашифрувала пароль до сховища. Розшифруйте його! Натискайте літери на клавіатурі — по одній для кожної клітинки.', {noNext:true});
  await cancellable(res => {
    let cur = 0, miss = 0; slots[0].classList.add('act');
    p.querySelectorAll('.key').forEach(k => k.onclick = () => {
      if(cur >= word.length) return;
      const s = slots[cur]; s.textContent = k.dataset.ch;
      if(k.dataset.ch === word[cur]){
        s.className = 'cslot ok'; p.querySelectorAll('.key.hint').forEach(x => x.classList.remove('hint'));
        miss = 0; cur++;
        if(cur < word.length){ slots[cur].classList.add('act'); textEl.innerHTML = `Так! ${enc[cur - 1]} → <i>${word[cur - 1]}</i>. Наступна літера: <i>${enc[cur]}</i>.`; }
        else { textEl.innerHTML = 'Пароль розшифровано!'; setTimeout(res, 1200); }
      } else {
        s.className = 'cslot act bad'; miss++;
        const e = enc[cur];
        textEl.innerHTML = `Не ${k.dataset.ch}… Знайдіть у абетці літеру <i>${e}</i> і візьміть ту, що стоїть <i>перед нею</i>.`;
        if(miss >= 2) p.querySelectorAll('.key').forEach(x => x.classList.toggle('hint', x.dataset.ch === e));
        setTimeout(() => { if(slots[cur] === s && !s.classList.contains('ok')){ s.textContent = ''; s.className = 'cslot act'; } }, 800);
      }
    });
  });
  closePanel();
}

const RX = /^(X{0,3})(IX|IV|V?I{0,3})$/;
function romanVal(r){ if(!r || !RX.test(r)) return null; const v = {I:1, V:5, X:10}; let t = 0; for(let i = 0; i < r.length; i++){ const a = v[r[i]], b = v[r[i + 1]] || 0; t += a < b ? -a : a; } return t; }

  const svg = p.querySelector('svg.sticks');
  let st = {nums:start.nums.slice(), op:start.op}, held = null;
  const stickSVG = (x1, y1, x2, y2, cls = '', data = '') =>
    `<g class="${cls}" ${data}><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#6b4214" stroke-width="22" stroke-linecap="round"/><line class="wood" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ecc77e" stroke-width="13" stroke-linecap="round"/><circle cx="${x1}" cy="${y1}" r="14" fill="#c0392b" stroke="#6b1a10" stroke-width="3"/></g>`;
  const ghostSVG = (x, data) => `<g class="ghostS" ${data}><line x1="${x}" y1="120" x2="${x}" y2="300"/><rect x="${x - 26}" y="110" width="52" height="200" fill="transparent"/></g>`;
  function render(){
    // спочатку рахуємо ширину
    const items = [];
    const pushNum = k => {
      if(held) items.push({g:'ghost', k, at:0});
      st.nums[k].split('').forEach((ch, ci) => items.push({g:ch, k, ci}));
      if(held) items.push({g:'ghost', k, at:st.nums[k].length});
    };
    pushNum(0); items.push({g:'op'}); pushNum(1); items.push({g:'eq'}); pushNum(2);
    const wOf = it => it.g === 'I' ? 54 : it.g === 'V' ? 124 : it.g === 'X' ? 124 : it.g === 'ghost' ? 60 : 190;
    const total = items.reduce((a, it) => a + wOf(it), 0); let x = (1400 - total) / 2;
    let out = '';
    items.forEach(it => {
      const w = wOf(it), cx = x + w / 2;
      if(it.g === 'I') out += stickSVG(cx, 120, cx, 300, 'st', `data-k="${it.k}" data-ci="${it.ci}"`);
      if(it.g === 'V') out += stickSVG(cx - 46, 120, cx, 300) + stickSVG(cx + 46, 120, cx, 300);
      if(it.g === 'X') out += stickSVG(cx - 46, 120, cx + 46, 300) + stickSVG(cx + 46, 120, cx - 46, 300);
      if(it.g === 'ghost') out += ghostSVG(cx, `data-k="${it.k}" data-at="${it.at}"`);
      if(it.g === 'op'){
        out += stickSVG(cx - 60, 210, cx + 60, 210);
        if(st.op === '+') out += stickSVG(cx, 150, cx, 270);
        else if(held) out += `<g class="ghostS" data-op="1"><line x1="${cx}" y1="150" x2="${cx}" y2="270"/><rect x="${cx - 30}" y="140" width="60" height="140" fill="transparent"/></g>`;
      }
      if(it.g === 'eq') out += stickSVG(cx - 60, 180, cx + 60, 180) + stickSVG(cx - 60, 245, cx + 60, 245);
      x += w;
    });
    if(held) out += `<g class="ghostS" data-back="1"><text x="1250" y="40" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="26" fill="#7b4fa8">паличка в руці</text>${stickSVG(1180, 80, 1320, 80)}<rect x="1150" y="50" width="200" height="60" fill="transparent"/></g>`;
    svg.innerHTML = out;
  }
  render();
  await say('hypatia', 'На табличці паличками викладено <i>VI − II = II</i>. Але 6 − 2 не дорівнює 2! Перекладіть <i>одну</i> паличку, щоб рівність стала правильною.', {noNext:true});
  await cancellable(res => {
    svg.onclick = e => {
      const g = e.target.closest('g'); if(!g) return;
      if(!held && g.classList.contains('st')){
        const k = +g.dataset.k, ci = +g.dataset.ci;
        held = {k, ci}; const a = st.nums[k];
        st.nums[k] = a.slice(0, ci) + a.slice(ci + 1);
        render(); textEl.innerHTML = 'Паличку взято! Тепер натисніть на одне з <i>пунктирних місць</i>. Передумали — натисніть «паличка в руці».'; return;
      }
      if(held && g.dataset.back){ const {k, ci} = held; st.nums[k] = st.nums[k].slice(0, ci) + 'I' + st.nums[k].slice(ci); held = null; render(); textEl.innerHTML = 'Паличку повернуто. Оберіть іншу.'; return; }
      if(held && g.classList.contains('ghostS')){
        if(g.dataset.op) st.op = '+';
        else { const k = +g.dataset.k, at = +g.dataset.at; st.nums[k] = st.nums[k].slice(0, at) + 'I' + st.nums[k].slice(at); }
        held = null; render();
        const [a, b, c] = st.nums.map(romanVal), shown = `${st.nums[0]} ${st.op === '+' ? '+' : '−'} ${st.nums[1]} = ${st.nums[2]}`;
        if(a === null || b === null || c === null){
          textEl.innerHTML = `Вийшло <i>${shown}</i> — але такого римського числа не буває. Спробуймо ще раз!`;
        } else if((st.op === '+' ? a + b : a - b) === c){
          textEl.innerHTML = `Правильно! <i>${shown}</i>, бо ${a} ${st.op === '+' ? '+' : '−'} ${b} = ${c}.`;
          setTimeout(() => res(shown), 1800); return;
        } else {
          textEl.innerHTML = `Вийшло <i>${shown}</i>, тобто ${a} ${st.op === '+' ? '+' : '−'} ${b} = ${c}? Ні, неправда. Спробуймо ще раз!`;
        }
        setTimeout(() => { st = {nums:start.nums.slice(), op:start.op}; render(); }, 2600);
      }
    };
  });
  closePanel();
  await say('hypatia', 'Молодці! До речі, цю головоломку можна розв’язати <i>кількома способами</i>. Спробуйте вдома знайти інші!');
}

/* ---- 2.1 зіпсований рукопис ---- */
const MS = [
  {t:'у', fix:'У', why:'Речення починається з великої літери.'},
  {t:' '}, {t:'києві', fix:'Києві', why:'Назви міст пишемо з великої літери.'},
  {t:' '}, {t:'жив'}, {t:' '}, {t:'князь'}, {t:' '}, {t:'Ярослав'}, {t:' '},
  {t:'мудрий', fix:'Мудрий', why:'Прізвисько князя — частина імені, тому з великої літери.'}, {t:'. '},
  {t:'Він'}, {t:' '}, {t:'дуже'}, {t:' '}, {t:'любив'}, {t:' '},
  {t:'книшки', fix:'книжки', why:'Перевіряємо: книжечка — чуємо [ж].'}, {t:'. '},
  {t:'Князь'}, {t:' '}, {t:'зібрав'}, {t:' '}, {t:'багато'}, {t:' '},
  {t:'рукописсів', fix:'рукописів', why:'Перевіряємо: рукопис — одна літера с.'}, {t:' '},
  {t:'і'}, {t:' '}, {t:'заснував'}, {t:' '}, {t:'бібліотеку'}, {t:' '}, {t:'при'}, {t:' '}, {t:'Софійському'}, {t:' '}, {t:'соборі'}, {t:'.'}
];
async function manuscriptTask(){
  const p = panel('Українська мова', 'Зіпсований літопис');
  const total = MS.filter(m => m.fix).length;
  let html = '<div class="counter">Виправлено: <span>0</span> з ' + total + '</div><div class="manuscript">';
  MS.forEach((m, i) => { html += m.t.trim() ? `<span class="w" data-i="${i}">${m.t}</span>` : m.t; });
  p.insertAdjacentHTML('beforeend', html + '</div>');
  const ms = p.querySelector('.manuscript'), cnt = p.querySelector('.counter span');
  await say('nestor', 'У тексті <i>5 помилок</i>. Натискайте на слово, у якому помилка, — і обирайте, як правильно.', {noNext:true});
  let found = 0;
  while(found < total){
    const w = await cancellable(res => { ms.onclick = e => { const x = e.target.closest('.w'); if(x && !x.classList.contains('fixed')) res(x); }; });
    ms.onclick = null;
    const m = MS[+w.dataset.i];
    if(!m.fix){
      w.classList.remove('no'); void w.offsetWidth; w.classList.add('no'); setTimeout(() => w.classList.remove('no'), 700);
      textEl.innerHTML = `У слові «${m.t}» помилки немає. Шукайте далі!`; continue;
    }
    w.classList.add('cur');
    await say('nestor', `Як правильно написати?`, {noNext:true});
    await choose(shuffle([m.fix, m.t]), m.fix, () => { textEl.innerHTML = 'Ні, так і було з помилкою. Подумайте ще!'; });
    w.textContent = m.fix; w.className = 'w fixed'; found++; cnt.textContent = found;
    choicesEl.innerHTML = ''; textEl.innerHTML = `Так! <i>${m.fix}</i>. ${m.why}` + (found < total ? ' Шукайте далі!' : ''); talk('nestor');
    if(found === total){ sfx('win'); await sleep(2200); }
  }
  closePanel();
}

/* ---- 2.2 буквиці ---- */
async function bukvytsiTask(){
  const word = 'ЛІТОПИС'.split(''), letters = ['С', 'О', 'Т', 'Л', 'И', 'П', 'І'];
  const p = panel('Українська мова', 'Буквиці з рукопису');
  const W = 112, G = 20, x0 = (1400 - (word.length * W + (word.length - 1) * G)) / 2;
  const pool = [[170, 470], [340, 570], [510, 470], [680, 570], [850, 470], [1020, 570], [1170, 470]];
  p.insertAdjacentHTML('beforeend', '<div class="rule" style="top:110px">Натискайте на буквиці, щоб скласти слово. Натисніть на клітинку — і буквиця повернеться.</div>');
  const slots = word.map((_, i) => { const d = document.createElement('div'); d.className = 'bslot'; d.style.left = (x0 + i * (W + G)) + 'px'; d.style.top = '230px'; p.append(d); return d; });
  const tiles = letters.map((ch, i) => { const d = document.createElement('div'); d.className = 'bq'; d.textContent = ch; d.dataset.i = i; p.append(d); return d; });
  let place = Array(word.length).fill(null), locked = 0;
  const homeOf = i => pool[i];
  function layout(){
    tiles.forEach((t, i) => {
      const si = place.indexOf(i);
      if(si >= 0){ t.style.left = (x0 + si * (W + G)) + 'px'; t.style.top = '230px'; t.style.transform = 'none'; }
      else { const [x, y] = homeOf(i); t.style.left = x + 'px'; t.style.top = y + 'px'; t.style.transform = `rotate(${(i % 2 ? 1 : -1) * (4 + i)}deg)`; }
    });
    slots.forEach((s, i) => s.className = 'bslot' + (i < locked ? ' ok' : ''));
  }
  layout();
  await say('nestor', 'Ой, з рукопису випали розмальовані великі літери — <i>буквиці</i>. Складіть із них назву книги, яку я пишу!', {noNext:true});
  await cancellable(res => {
    p.onclick = e => {
      const t = e.target.closest('.bq');
      if(!t) return;
      const i = +t.dataset.i, si = place.indexOf(i);
      if(si >= 0){ if(si < locked) return; place[si] = null; layout(); return; }
      const free = place.indexOf(null); if(free < 0) return;
      place[free] = i; layout();
      if(place.indexOf(null) < 0){
        const got = place.map(k => letters[k]).join('');
        if(got === word.join('')){ slots.forEach(s => s.className = 'bslot ok'); textEl.innerHTML = 'Вийшло слово <i>ЛІТОПИС</i>!'; p.onclick = null; setTimeout(res, 1300); }
        else {
          slots.forEach((s, k) => { if(k >= locked) s.className = 'bslot bad'; });
          textEl.innerHTML = `«${got}» — такого слова немає. Підказка: слово починається на <i>${word.slice(0, locked + 1).join('')}</i>…`;
          setTimeout(() => {
            place = place.map((k, idx) => idx < locked ? k : null);
            const need = word[locked], ti = letters.findIndex((ch, idx) => ch === need && !place.includes(idx));
            place[locked] = ti; locked++; layout();
          }, 1000);
        }
      }
    };
  });
  closePanel();
  await say('murko', 'ЛІТОПИС! А що це таке?', {emo:'murko_thinking'});
  await say('nestor', 'Гарне питання, Мурко! Друзі, допоможіть йому — подумайте, що ж таке <i>літопис</i>.');
  await say('nestor', 'Оберіть правильну відповідь:', {noNext:true});
  await choose(shuffle(['Записи подій рік за роком', 'Збірка казок про богатирів', 'Книга з малюнками для дітей']), 'Записи подій рік за роком', () => { textEl.innerHTML = 'Не зовсім… Підказка: у слові «літопис» сховалося слово «літо».'; });
  await say('nestor', 'Саме так! Колись слово <i>«літо»</i> означало <i>«рік»</i>. Тому літопис — це записи про події рік за роком.');
}

/* ---- 2.3 хто який майстер ---- */
async function mastersTask(){
  const NAMES3 = ['Остап', 'Марко', 'Іван'], PROF = ['гончар', 'коваль', 'писар'], ANS = {'Остап':'писар', 'Марко':'гончар', 'Іван':'коваль'};
  const p = panel('Логіка · бонус', 'Хто який майстер?', true);
  p.insertAdjacentHTML('beforeend', `<div class="clues">Троє майстрів — Остап, Марко й Іван. Один — <b>гончар</b> (ліпить із глини), другий — <b>коваль</b> (кує метал), третій — <b>писар</b>.<br>• Остап не працює ні з глиною, ні з металом.<br>• Марко — не коваль.</div>`);
  const pickd = {};
  NAMES3.forEach((n, r) => {
    const row = document.createElement('div'); row.className = 'mrow'; row.style.top = (350 + r * 94) + 'px';
    row.innerHTML = `<div class="who">${n}</div>` + PROF.map(pr => `<button class="ch" data-n="${n}" data-p="${pr}">${pr}</button>`).join('');
    p.append(row);
  });
  const btn = document.createElement('button'); btn.className = 'pbtn'; btn.textContent = 'Перевірити'; btn.style.top = '668px'; btn.style.padding = '12px 46px'; p.append(btn);
  await say('nestor', 'Прочитайте підказки й оберіть для кожного майстра його ремесло.', {noNext:true});
  await cancellable(res => {
    p.onclick = e => {
      const b = e.target.closest('.mrow .ch');
      if(b){ pickd[b.dataset.n] = b.dataset.p; p.querySelectorAll(`.mrow .ch[data-n="${b.dataset.n}"]`).forEach(x => x.classList.toggle('on', x === b)); p.querySelectorAll('.mrow .ch').forEach(x => x.classList.remove('right', 'wrong')); return; }
      if(e.target === btn){
        if(Object.keys(pickd).length < 3){ textEl.innerHTML = 'Оберіть ремесло для <i>кожного</i> майстра.'; return; }
        let ok = true;
        NAMES3.forEach(n => { const el = p.querySelector(`.mrow .ch[data-n="${n}"][data-p="${pickd[n]}"]`); const good = pickd[n] === ANS[n]; el.classList.add(good ? 'right' : 'wrong'); ok = ok && good; });
        if(ok){ textEl.innerHTML = 'Правильно! Остап — писар, Марко — гончар, Іван — коваль.'; p.onclick = null; setTimeout(res, 1800); }
        else if(pickd['Остап'] !== 'писар') textEl.innerHTML = 'Почніть з Остапа: він не працює ні з глиною, ні з металом. Хто ж він?';
        else textEl.innerHTML = 'Остап — писар, це вірно! Тепер Марко: він не коваль, а писарем уже є Остап…';
      }
    };
  });
  closePanel();
  await say('nestor', 'Молодці! Так міркують справжні детективи: відкидаємо зайве — і лишається правильна відповідь.');

const DIRS = {'Північ':[0,-1,'↑'], 'Південь':[0,1,'↓'], 'Схід':[1,0,'→'], 'Захід':[-1,0,'←']};
async function shipTask(){

  { const cx = ISLAND[0]*C + 45, cy = ISLAND[1]*C + 50; g += `<ellipse cx="${cx}" cy="${cy+16}" rx="42" ry="20" fill="#f3d98b" stroke="#c9a54a" stroke-width="3"/><path d="M${cx} ${cy+14} Q${cx+4} ${cy-12} ${cx-2} ${cy-30}" stroke="#7a5320" stroke-width="6" fill="none"/><path d="M${cx-2} ${cy-30} q-24 -6 -32 8 M${cx-2} ${cy-30} q22 -10 32 4 M${cx-2} ${cy-30} q-6 -22 -20 -24 M${cx-2} ${cy-30} q14 -20 26 -16" stroke="#3f8a3a" stroke-width="7" fill="none" stroke-linecap="round"/>`; }
  g += `</svg><svg class="ship" viewBox="0 0 90 90"><path d="M14 56 L76 56 L66 74 L24 74 Z" fill="#8a5a2b" stroke="#4a2f14" stroke-width="3"/><line x1="45" y1="14" x2="45" y2="58" stroke="#4a2f14" stroke-width="4"/><path d="M47 16 Q70 30 47 50 Z" fill="#fffaf0" stroke="#8a6224" stroke-width="2"/><path d="M43 20 Q24 32 43 50 Z" fill="#f6e8c8" stroke="#8a6224" stroke-width="2"/><path d="M45 14 l12 4 l-12 4 z" fill="#c0392b"/></svg></div>`;
  g += `<svg class="compass" viewBox="-125 -125 250 250"><circle r="80" fill="#fffaf0" stroke="#8a6224" stroke-width="4"/><path d="M0 -62 L12 0 L0 62 L-12 0 Z" fill="#c0392b"/><path d="M0 -62 L12 0 L0 0 Z" fill="#7a1f12"/><path d="M-62 0 L0 -12 L62 0 L0 12 Z" fill="#3b2412" opacity=".8"/><text y="-88" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="30" fill="#3b2412">Пн</text><text y="112" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="30" fill="#3b2412">Пд</text><text x="84" y="10" text-anchor="start" font-family="Nunito" font-weight="800" font-size="30" fill="#3b2412">Сх</text><text x="-84" y="10" text-anchor="end" font-family="Nunito" font-weight="800" font-size="30" fill="#3b2412">Зх</text></svg>`;
  g += '<div class="cmds">' + Object.entries(DIRS).map(([k, v]) => `<button class="ch" data-d="${k}">${v[2]} ${k}</button>`).join('') + '</div>';
  g += '<div class="prog"><span class="empty">Програма порожня…</span></div><div class="pbtns"><button class="del">Стерти крок</button><button class="clr">Очистити</button><button class="go">Пуск ▶</button></div>';
  p.insertAdjacentHTML('beforeend', g);
  const ship = p.querySelector('.ship'), prog = p.querySelector('.prog');
  const place = ([x, y]) => { ship.style.left = x*C + 'px'; ship.style.top = y*C + 'px'; };

  let cmds = [], busy = false;
  const render = () => { prog.innerHTML = cmds.length ? cmds.map((d, i) => `<span class="step" data-i="${i}">${DIRS[d][2]} ${d}</span>`).join('') : '<span class="empty">Програма порожня…</span>'; };

        if(!cmds.length){ textEl.innerHTML = 'Спочатку додайте кроки програми.'; return; }
        busy = true; place(START); await new Promise(r => setTimeout(r, 300));

          if(REEFS.some(([rx, ry]) => rx === x && ry === y)){ sfx('crash'); fail = `Бум! Крок ${i + 1} — корабель налетів на риф.`; break; }
          if(x === ISLAND[0] && y === ISLAND[1]){ sfx('win'); textEl.innerHTML = 'Земля! Корабель доплив до острова!'; p.onclick = null; setTimeout(res, 1600); return; }
        }
        textEl.innerHTML = (fail || 'Програма закінчилась, а до острова ще не допливли.') + ' Виправте програму і спробуйте ще раз!';
        setTimeout(() => { place(START); prog.querySelectorAll('.step').forEach(s => s.classList.remove('run')); busy = false; }, 900);
      }
    };
  });
  closePanel();
}

/* ---- 4.3 шестерні ---- */
function gearPath(teeth, R, r){
  let d = '';
  const step = Math.PI * 2 / teeth;
  for(let i = 0; i < teeth; i++){
    const a = i * step, pts = [[a, r], [a + step * .15, R], [a + step * .45, R], [a + step * .6, r]];
    pts.forEach(([ang, rad], k) => { const x = (rad * Math.sin(ang)).toFixed(1), y = (-rad * Math.cos(ang)).toFixed(1); d += (i === 0 && k === 0 ? 'M' : 'L') + x + ' ' + y + ' '; });
  }
  return d + 'Z';
}
async function gearsTask(){
  const p = panel('Логіка · бонус', 'Шестерні паровоза', true);

  for(let i = 0; i < N; i++){
    const cx = cx0 + i * gap, cy = i % 2 ? 250 : 190, col = i === 0 ? '#c9952f' : i === N - 1 ? '#c0392b' : '#9aa3ab';
    g += `<g transform="translate(${cx} ${cy})"><g class="g ${i % 2 ? 'ccw' : 'cw'}" style="animation-delay:0s"><path d="${gearPath(12, R, r)}" fill="${col}" stroke="#3b2412" stroke-width="4" transform="rotate(${i % 2 ? 15 : 0})"/><circle r="34" fill="#fffaf0" stroke="#3b2412" stroke-width="4"/><circle r="10" fill="#3b2412"/></g>
      <text y="${i % 2 ? 165 : -140}" text-anchor="middle" font-family="Comfortaa" font-weight="700" font-size="34" fill="#3b2412">${i + 1}</text></g>`;
  }
  g += `<path d="M ${cx0 - 70} 60 A 140 140 0 0 1 ${cx0 + 70} 60" stroke="#2f9e44" stroke-width="8" fill="none" marker-end="url(#ar)" transform="translate(0 10)"/><defs><marker id="ar" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#2f9e44"/></marker></defs></svg>`;

/* ---- 5.1 лабіринт з повторенням ---- */
const MAZE = {path:[[0,4],[0,3],[1,3],[1,2],[2,2],[2,1],[3,1],[3,0],[4,0]], start:[0,4], goal:[4,0]};
const D5 = {'Вгору':[0,-1,'↑'], 'Вниз':[0,1,'↓'], 'Праворуч':[1,0,'→'], 'Ліворуч':[-1,0,'←']};
async function mazeTask(){
  const p = panel('Інформатика · повторення', 'Програма для Байта');
  const C = 100, isPath = (x, y) => MAZE.path.some(([a, b]) => a === x && b === y);
  let h = '<div class="lab">';
  for(let y = 0; y < 5; y++) for(let x = 0; x < 5; x++) h += `<div class="c ${isPath(x, y) ? 'path' : 'wall'}" style="left:${x*C}px;top:${y*C}px"></div>`;
  h += `<div class="goal" style="left:${MAZE.goal[0]*C}px;top:${MAZE.goal[1]*C}px"><img src="${IMG.core_violet}" alt=""></div><div class="bot"><img src="${IMG.byte}" alt=""></div></div>`;
  h += `<div class="rep"><div class="hd">Повтори <button class="mn">−</button><span class="num">1</span><button class="pl">+</button> разів:</div><div class="body"></div></div>`;
  h += '<div class="cmds5">' + Object.entries(D5).map(([k, v]) => `<button class="ch" data-d="${k}">${v[2]} ${k}</button>`).join('') + '</div>';
  h += '<div class="pb5"><button class="del">Стерти крок</button><button class="clr">Очистити</button><button class="go">Пуск ▶</button></div>';
  h += '<div class="rule" style="top:560px;left:620px;right:60px;text-align:left;font-size:27px">У рамку можна покласти <b>не більше 3 команд</b> — а повторити їх скільки завгодно разів.</div>';
  p.insertAdjacentHTML('beforeend', h);
  const bot = p.querySelector('.bot'), body = p.querySelector('.body'), num = p.querySelector('.num');
  const place = ([x, y]) => { bot.style.left = x*C + 'px'; bot.style.top = y*C + 'px'; };
  place(MAZE.start);
  let cmds = [], n = 1, busy = false;
  const render = () => { body.innerHTML = cmds.length ? cmds.map(d => `<span class="step">${D5[d][2]} ${d}</span>`).join('') : '<span class="empty">Покладіть сюди команди…</span>'; num.textContent = n; };
  render();
  await say('byte', 'Подивіться на коридор: він іде <i>сходинками</i>. Знайдіть, які кроки повторюються, покладіть їх у рамку «Повтори» і виберіть, скільки разів!', {noNext:true});
  await cancellable(res => {
    p.onclick = async e => {
      if(busy) return;
      const b = e.target.closest('button'); if(!b) return;
      if(b.dataset.d){ if(cmds.length < 3){ cmds.push(b.dataset.d); render(); } else textEl.innerHTML = 'У рамці вже 3 команди — більше не влізе. Подумайте, що саме <i>повторюється</i>.'; return; }
      if(b.classList.contains('pl')){ n = Math.min(9, n + 1); render(); return; }
      if(b.classList.contains('mn')){ n = Math.max(1, n - 1); render(); return; }
      if(b.classList.contains('del')){ cmds.pop(); render(); return; }
      if(b.classList.contains('clr')){ cmds = []; n = 1; render(); place(MAZE.start); return; }
      if(b.classList.contains('go')){
        if(!cmds.length){ textEl.innerHTML = 'Спочатку покладіть команди в рамку.'; return; }
        busy = true; place(MAZE.start); await new Promise(r => setTimeout(r, 300));
        let [x, y] = MAZE.start, fail = null, steps = 0;
        outer: for(let k = 0; k < n; k++){
          for(let i = 0; i < cmds.length; i++){
            body.querySelectorAll('.step').forEach((s, j) => s.classList.toggle('run', j === i));
            const [dx, dy] = D5[cmds[i]]; x += dx; y += dy; steps++;
            if(x < 0 || y < 0 || x > 4 || y > 4 || !isPath(x, y)){ sfx('crash'); fail = `Бум! На ${k + 1}-му повторі Байт врізався в стіну.`; place([x, y]); await new Promise(r => setTimeout(r, 450)); break outer; }
            place([x, y]); sfx('step'); await new Promise(r => setTimeout(r, 450));
            if(x === MAZE.goal[0] && y === MAZE.goal[1]){
              if(k === n - 1 && i === cmds.length - 1){ sfx('win'); textEl.innerHTML = `Байт біля ядра! Програма: повтори ${n} рази <i>${cmds.map(d => D5[d][2]).join(' ')}</i>.`; p.onclick = null; setTimeout(res, 1800); return; }
              fail = 'Байт уже біля ядра, але програма ще не закінчилась і повела його далі. Зменшіть кількість повторів!'; break outer;
            }
          }
        }
        if(!fail) fail = `Повтори скінчились, а до ядра ще не дійшли. ${n < 4 ? 'Може, повторити більше разів?' : 'Перевірте команди в рамці.'}`;
        textEl.innerHTML = fail;
        setTimeout(() => { place(MAZE.start); body.querySelectorAll('.step').forEach(s => s.classList.remove('run')); busy = false; }, 1000);
      }
    };
  });
  closePanel();
}

  ['Який він на вигляд?', ['як окуляри', 'як рюкзак', 'як парасолька', 'як велосипед']]
];
async function inventTask(){
  const p = panel('Творче завдання', 'Ядро уяви: винахід для 3027 року');
  let h = '<div class="inv">';
  INV_Q.forEach(([q, opts], i) => h += `<div class="row" data-r="${i}"><div class="q">${i + 1}. ${q}</div><div class="opts">${opts.map(o => `<button class="ch" data-o="${o}">${o}</button>`).join('')}</div></div>`);
  h += '</div>';
  p.insertAdjacentHTML('beforeend', h);
  const btn = document.createElement('button'); btn.className = 'pbtn'; btn.textContent = 'Створити винахід'; btn.style.top = '640px'; p.append(btn);
  await say('chron', 'Вигадайте винахід для 3027 року! Обговоріть усім класом і оберіть по одній відповіді в кожному рядку.', {noNext:true});
  const pick = {};
  await cancellable(res => {
    p.onclick = e => {
      const b = e.target.closest('.opts .ch');
      if(b){ const r = b.closest('.row').dataset.r; pick[r] = b.dataset.o; b.parentNode.querySelectorAll('.ch').forEach(x => x.classList.toggle('on', x === b)); return; }
      if(e.target === btn){
        if(Object.keys(pick).length < 3){ textEl.innerHTML = 'Оберіть відповідь у <i>кожному</i> рядку — і винахід готовий!'; return; }
        p.onclick = null; res();
      }
    };
  });
  const look = pick[2].replace('як ', ''), names = {'окуляри':'Чарівні окуляри', 'рюкзак':'Розумний рюкзак', 'парасолька':'Чарівна парасолька', 'велосипед':'Диво-велосипед'};
  st5.invention = names[look] || 'Наш винахід';
  closePanel();
  const box = $('#taskBox');
  box.innerHTML = `<div class="dim"></div><div class="invcard"><div class="t">Винахід нашого класу</div><input id="invName" value="${st5.invention}" maxlength="40"><small>назву можна змінити</small><p>Допомагає <b>${pick[0]}</b>,<br>уміє <b>${pick[1]}</b>,<br>а виглядає <b>${pick[2]}</b>.</p></div>`;
  box.classList.add('on');
  const inp = $('#invName'); inp.oninput = () => st5.invention = inp.value.trim() || 'Наш винахід';
  await say('chron', 'Чудова ідея! Можливо, хтось із вас колись справді створить такий винахід.');
  closePanel();
}

  await say('murko', 'Друзі, ви зробили це! Тепер ви теж <i>Хранителі часу</i>!', {emo:'murko_wave'});

  await sleep(1200);

/* ---- сертифікат ---- */
const certState = {cls:'4'};
async function drawCert(cv){
  await document.fonts.load('700 80px Comfortaa'); await document.fonts.load('800 40px Nunito');
  const ctx = cv.getContext('2d'), bg = new Image();
  await new Promise(r => { bg.onload = r; bg.onerror = r; bg.src = BG.cert; });
  const paint = () => {
    ctx.clearRect(0, 0, 1920, 1080); ctx.drawImage(bg, 0, 0, 1920, 1080);
    ctx.textAlign = 'center'; ctx.fillStyle = '#3b2412';
    ctx.font = '700 40px Comfortaa'; ctx.fillStyle = '#7a5320'; ctx.fillText('СЕРТИФІКАТ', 960, 258);
    ctx.font = '700 92px Comfortaa'; ctx.fillStyle = '#5a3a14'; ctx.fillText('Хранителі часу', 960, 360);
    ctx.font = '600 38px Nunito'; ctx.fillStyle = '#3b2412';
    ctx.fillText('вручається учням ' + (certState.cls || '___') + ' класу', 960, 440);
    ctx.fillText('за повернення п’яти ядер Архіву часу', 960, 492);
    ctx.font = '800 32px Nunito'; ctx.fillStyle = '#7b4fa8'; ctx.fillText('Винахід класу: «' + st5.invention + '»', 960, 566);
    const d = new Date(), dd = String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear();
    ctx.font = '600 28px Nunito'; ctx.fillStyle = '#5a3a14';
    ctx.textAlign = 'left'; ctx.fillText(dd, 560, 640);
    ctx.textAlign = 'right'; ctx.fillText('Хрон, Байт і Мурко', 1360, 640);
  };
  paint(); return paint;
}
async function certificate(){
  music('cert');
  setBg('cert'); clearFx(); hud(false);
  const c = $('#cert'); c.innerHTML = '<canvas width="1920" height="1080"></canvas>'; c.classList.add('on');
  const cv = c.querySelector('canvas'), paint = await drawCert(cv); sfx('fanfare');
  const bar = document.createElement('div'); bar.className = 'certbar';
  bar.innerHTML = `Клас: <input id="certCls" value="${certState.cls}" maxlength="8"><button id="certSave">Зберегти картинку</button><button class="plain" id="certAgain">Пройти ще раз</button>`;
  c.append(bar);
  const ci = bar.querySelector('#certCls');
  ci.oninput = () => { certState.cls = ci.value.trim(); paint(); };
  bar.querySelector('#certSave').onclick = () => {
    const showBox = url => {
      const box = document.createElement('div'); box.className = 'savebox';
      box.innerHTML = url ? `<img src="${url}" alt="Сертифікат"><p>Картинка завантажується в папку «Завантаження». Якщо цього не сталося — натисніть на сертифікат <b>правою кнопкою миші</b> і оберіть «Зберегти зображення як…».</p><button>Закрити</button>`
                          : '<p>Збереження не вдалося в цьому браузері. Зробіть знімок екрана — на Windows: Win + Shift + S.</p><button>Закрити</button>';
      box.querySelector('button').onclick = () => box.remove();
      stage.append(box);
    };
    try {
      cv.toBlob(blob => {
        if(!blob){ showBox(null); return; }
        const url = URL.createObjectURL(blob);
        try { const a = document.createElement('a'); a.download = 'Хранителі часу ' + (certState.cls || '') + '.png'; a.href = url; document.body.append(a); a.click(); a.remove(); } catch(e){}
        showBox(url);
      }, 'image/png');
    } catch(e){ showBox(null); }
  };
  bar.querySelector('#certAgain').onclick = () => { music(null); reset(); state.cores = [false, false, false, false, false]; $('#title').classList.remove('off'); setBg('city'); hud(false); };
  hideDialog();
}

/* ================== запуск і меню ================== */
let current = null;
async function run(fn, arg){
  cancelAll(); current = fn;
  try { await fn(arg); }
  catch(e){ if(e !== ABORT) console.error(e); }
}
function reset(){
  cancelAll(); hideDialog(); clearActors(); clearFx(); $('#fade').classList.remove('on');
  $('#reward').innerHTML = ''; document.querySelectorAll('.frag,.ghost,.savebox').forEach(e => e.remove());
  $('#cert').classList.remove('on'); $('#cert').innerHTML = '';
  ['#watchBox', '#mapBox', '#portal', '#taskBox'].forEach(s => { $(s).classList.remove('on'); $(s).innerHTML = ''; });
  document.querySelectorAll('.bigbtn:not(#btnStart)').forEach(b => b.remove());
}

  ['1. Горище і годинник', scene1, 0], ['2. Місто 3027', scene2, 0], ['3. Зала Архіву і карта часу', scene3, 0],
  ['4. Епоха 1. Давній світ', era1, 0], ['Архів після 1-го ядра', hallReturn, 1],
  ['5. Епоха 2. Середньовіччя', era2, 1], ['Архів після 2-го ядра', hallReturn, 2],
  ['6. Епоха 3. Відродження і відкриття', era3, 2], ['Архів після 3-го ядра', hallReturn, 3],
  ['7. Епоха 4. Доба винаходів', era4, 3], ['Архів після 4-го ядра', hallReturn, 4],
  ['8. Епоха 5. Архів 3027', era5, 4], ['9. Фінал', finale, 5], ['10. Сертифікат', certificate, 5]

function buildMenu(){
  const m = $('#menu'); m.innerHTML = '<h3>Перейти до сцени</h3>';
  SCENES.forEach(([label, fn, cores]) => { const b = document.createElement('button'); b.textContent = label; b.onclick = () => { m.classList.remove('on'); $('#title').classList.add('off'); reset(); state.cores = state.cores.map((_, i) => i < cores); run(fn); }; m.append(b); });
  m.insertAdjacentHTML('beforeend', '<small>Далі — пробіл, Enter або →. Повний екран — F. Музика — ♪ або M, звуки — 🔊 або S.</small>');
}
buildMenu();
$('#btnMenu').onclick = () => $('#menu').classList.toggle('on');

$('#btnMusic').onclick = () => setMusic(!MUS.on);

$('#btnStart').onclick = () => {

};
setBg('city');
